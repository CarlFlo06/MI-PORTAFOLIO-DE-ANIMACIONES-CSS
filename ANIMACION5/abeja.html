<html>

<head>
    <title>ANIMACIONES CSS3</title>
    <link rel="stylesheet" href="../css/menu.css">
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .contenedor {
            width: 400px;
            height: 200px;
            position: relative;
            /*provoca el centrado del div contenedor*/
            margin: 0 auto;
            /*provoca el centrado del div contenedor*/
            overflow: hidden;
            background-image: url(img/campo.avif);
            background-repeat: no-repeat;
            background-size: cover;

        }

        .cuadrito {
            top: 150px;
            width: 50px;
            height: 50px;
            position: absolute;
            left: -50px;

            animation: cuadrito 10s infinite;
        }

        @keyframes cuadrito {
            0% {
                top: 150px;
                left: -50px;
                rotate: 0deg;
            }

            50% {
                top: 0px;
                left: 175px;
                rotate: 60deg;
            }

            100% {
                top: 150px;
                left: 400px;
                rotate: 0deg;
            }
        }

        .c2 {
            top: 0px;
            width: 50px;
            height: 50px;
            position: absolute;
            left: -50px;

            animation: c2 20s infinite;
        }

        @keyframes c2 {
            0% {
                top: 0px;
                left: -50px;
                rotate: 0deg;
            }

            50% {
                top: 150px;
                left: 175px;
                rotate: 60deg;
            }

            100% {
                top: 0px;
                left: 400px;
                rotate: 0deg;
            }
        }
    </style>
</head>

<body>

            <li><a href="../ANIMACION5/abeja.html">Abeja</a></li>
            <li><a href="../ANIMACION6/lugares.html">Turísmo Perú</a></li>
            <li><a href="../ANIMACION7/lenguajes.html">HTML - CSS - JS</a></li>
        </ul>
    </nav>
    <div class="contenedor">
        <div class="cuadrito">
            <img src="img/abeja.png" alt="" width="50">
        </div>
        <div class="c2">
            <img src="img/abeja.png" alt="" width="50">
        </div>
    </div>
</body>

</html>
