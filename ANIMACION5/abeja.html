<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMACIONES CSS3</title>
    <link rel="stylesheet" href="../css/menu.css">
    <style>
        body{
            background-color: black;
        }
        .contenedor {
            width: 100%;
            height: 600px;
            position: relative;
            /*provoca el centrado del div contenedor*/
            margin: 0 auto;
            /*provoca el centrado del div contenedor*/
            overflow: hidden;
            background-image: url(img/campo.avif);
            background-repeat: no-repeat;
            background-size: cover;

        }

        .cuadrito {
            top: 550px;
            width: 100px;
            height: 100px;
            position: absolute;
            left: -100px;
            background-image: url(img/abeja.png);
            background-size: cover;
            animation: cuadrito 10s infinite;
        }

        @keyframes cuadrito {
            0% {
                top: 550px;
                left: -100px;
                rotate: 0deg;
            }

            50% {
                top: 0px;
                left: 575px;
                rotate: 60deg;
            }

            100% {
                top: 550px;
                left: 100%;
                rotate: 0deg;
            }
        }

        .c2 {
            top: 0px;
            width: 100px;
            height: 100px;
            background-image: url(img/abeja.png);
            background-size: cover;
            position: absolute;
            left: -100px;
            animation: c2 20s infinite;
        }

        @keyframes c2 {
            0% {
                top: 0px;
                left: -100px;
                rotate: 0deg;
            }

            50% {
                top: 500px;
                left: 575px;
                rotate: 60deg;
            }

            100% {
                top: 0px;
                left: 100%;
                rotate: 0deg;
            }
        }
    </style>
    <script>
        const BASE = "../";
    </script>
    <script src="../js/menu.js"></script>
</head>

<body>
    <header id="menu"></header>
    <div class="contenedor">
        <div class="cuadrito">
        </div>
        <div class="c2">
        </div>
    </div>
</body>
</html>
