<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURISMO PERÚ</title>
    <link rel="stylesheet" href="../css/menu.css">
    <style>
        *{
            box-sizing: border-box;
        }
        .contenedor {
            width: 100%;
            height: 600px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* hasta aqui preparar para todas las clases */

        .tarjeta1,.tarjeta2,.tarjeta3,.tarjeta4 {
            width: 25%;
            top: -600px;
            height: 600px;
            position: absolute;
            background-size: cover;
            background-position: center;
        }

        .tarjeta1 {
            left: 0%;
            background-image: url(img/mar.jpg);
            animation: tarjeta1 3s 1 forwards;
        }

        .tarjeta2 {
            left: 25%;
            background-image: url(img/costa.jpg);
            animation: tarjeta1 3s 1 forwards 3s;
        }

        .tarjeta3 {
            left: 50%;
            background-image: url(img/sierra.jpg);
            animation: tarjeta1 3s 1 forwards 6s;
        }

        .tarjeta4 {
            left: 75%;
            background-image: url(img/selva.jpg);
            animation: tarjeta1 3s 1 forwards 9s;
        }

        /* LAS RICAS ANIMACIONES */
        @keyframes tarjeta1 {
            0% {
                top: -300px;
                transform: rotateY(180deg);
            }

            50% {
                top: 300px;
            }

            100% {
                top: 0px;
            }
        }

        /* EVENTOS */
        .tarjeta1:hover {
            transition: 1s;
            scale: 1.2;
            z-index: 1;
        }

        .tarjeta2:hover {
            transition: 1s;
            scale: 1.2;
            z-index: 1;
        }

        .tarjeta3:hover {
            transition: 1s;
            scale: 1.2;
            z-index: 1;
        }

        .tarjeta4:hover {
            transition: 1s;
            scale: 1.2;
            z-index: 1;
        }

        .texto {
            width: 100%;
            height: auto;
            font-size: 25px;
            top: -300px;
            padding: 20px;
            position: absolute;
            background-color: rgba(83, 75, 75, 0.493);
            animation: texto 3s 1 forwards 12s;
            text-align: center;
            color: blanchedalmond;
            z-index: 2;
            left: 0;
        }

        @keyframes texto {
            0% {
                top: -300px;
            }

            50% {
                top: 600px;
            }

            100% {
                top: 260px;
            }
        }

        .texto:hover {
            transition: 1s;
            scale: 1;
            background-color: aliceblue;
            color: black;
        }
        .cajita{
            width: 100%;
            max-width: 1200px;
            height: 600px;
            position: relative;
            margin: 0 auto;
        }
    </style>
</head>
