<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGAMAN</title>
    <link rel="stylesheet" href="../css/menu.css">
    <style>
        body{
            background-color: black;
        }
        #contenedor{
            width: 100%;
            height: 600px;
            position: relative;
            margin: 0 auto; /*centrar el contenedor*/
            overflow: hidden; /*Oculta todo lo que contiene*/
            background-image: url("img/images.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }
        #cuadrito{
            width: 300px;
            height: 300px;
            position: absolute; /*obligatorio para mover el div*/
            top: 80px;
            left: -100px;

            animation: cuadrito 4s infinite;
            animation-timing-function: linear; /*Por defecto esta en eacer*//*Define la forma de moverse*/
        }
        @keyframes cuadrito{
            from{
                left: -100%;
            }
            to{
                left: 100%;
            }
        }
        #cuadrito img{
            width: 300px;
            height: 300px;
        }
        @media (max-width: 950px) {
            
        }
    </style>
    <script>
        const BASE = "../";
    </script>
    <script src="../js/menu.js"></script>
</head>
<body>
    <header id="menu"></header>
    <div id="contenedor">
        <div id="cuadrito">
            <img src="img/megaman.gif" alt="">
        </div>
    </div>
</body>
</html>
