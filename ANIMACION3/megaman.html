    <link rel="stylesheet" href="../css/menu.css">
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #contenedor{
            width: 1200px;
            height: 600px;
            position: relative;
            margin: 0 auto; /*centrar el contenedor*/
            overflow: hidden; /*Oculta todo lo que contiene*/
            background-image: url("img/images.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }
        #cuadrito{
            width: 300px;
            height: 300px;
            position: absolute; /*obligatorio para mover el div*/
            top: 80px;
            left: -100px;

            animation: cuadrito 3s infinite;
            animation-timing-function: linear; /*Por defecto esta en eacer*//*Define la forma de moverse*/
        }
        @keyframes cuadrito{
            from{
                left: -100px;
            }
            to{
                left: 1200px;
            }
        }
        #cuadrito img{
            width: 300px;
            height: 300px;
        }
    </style>
</head>
