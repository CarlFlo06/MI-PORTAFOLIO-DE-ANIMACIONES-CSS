<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - CSS - JS</title>
    <link rel="stylesheet" href="../css/menu.css">
    <style>
        body{
            background-color: black;
        }
        .contenedor {
            width: 100%;
            height: 500px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        .cajita {
            width: 100%;
            max-width: 900px;
            height: 500px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        /* hasta aqui preparar para todas las clases */
        .tr1,.tr2,.tr3 {
            width: 33.3%;
            height: 500px;
            left: -300px;
            position: absolute;
            background-size: cover;
        }

        .tr1 {

            background-image: url(img/html.jpg);
            animation: tr1 3s 1 forwards;
        }

        .tr2 {
            background-image: url(img/css.jpg);
            animation: tr2 3s 1 forwards 3S;
        }

        .tr3 {
            background-image: url(img/js.jpg);
            animation: tr3 3s 1 forwards 6s;
        }

        @keyframes tr1 {
            0% {
                left: -100%;
            }

            100% {
                left: 0%;
            }
        }

        @keyframes tr2 {
            0% {
                left: -100%;
            }

            100% {
                left: 33.33%;
            }

        }

        @keyframes tr3 {
            0% {
                left: -100%;
            }

            100% {
                left: 66.66%;
            }
        }

        .tr1:hover {
            transition: 1s;
            scale: 1.2;
            z-index: 1;
        }

        .tr2:hover {
            transition: 1s;
            scale: 1.2;
            z-index: 1;
        }

        .tr3:hover {
            transition: 1s;
            scale: 1.2;
            z-index: 1;
        }

        .texto {
            width: 100%;
            height: auto;
            top: -500px;
            font-size: 40px;
            font-weight: bold;
            padding-top: 20px;
            padding-bottom: 20px;
            position: relative;
            background-color: rgb(0, 0, 0);
            animation: texto 3s 1 forwards 9s;
            text-align: center;
            color: blanchedalmond;
            z-index: 0;
            left: 0;
        }

        @keyframes texto {
            0% {
                top: -500px;
                transform: rotateY(180deg);
            }

            100% {
                top: 370px;
            }
        }

        .texto:hover {
            transition: 1s;
            scale: 1;
            color: white;
            background-color: rgb(0, 0, 0);
        }

        .tr1 .texto:hover {
            color: orangered;
        }

        .tr2 .texto:hover {
            color: rgb(5, 184, 255);
        }

        .tr3 .texto:hover {
            color: yellow;
        }
    </style>
    <script>
        const BASE = "../";
    </script>
    <script src="../js/menu.js"></script>
</head>

<body>
    <header id="menu"></header>
    <div class="contenedor">
        <div class="cajita">
            <div class="tr1">
                <div class="texto">HTML 5</div>
            </div>
            <div class="tr2">
                <div class="texto">CSS 3</div>
            </div>
            <div class="tr3">
                <div class="texto">JAVASCRIPT</div>
            </div>
        </div>
    </div>
</body>
</html>
